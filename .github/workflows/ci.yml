name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  web:
    name: Web app build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/src/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --test dashboard.test.mjs

  python:
    name: Python scripts and generated data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32.0" "pillow>=10.4"
      - name: Byte-compile every script
        run: python -m compileall -q agent app/src/bff data infra tools set_tool_allowlist.py
      - name: Generated tables match their sources
        run: |
          python data/fabric-iq/generate_pb_tables.py --check
          python data/fabric-iq/generate_cards_tables.py --check
          python data/fabric-iq/generate_books_tables.py --check
          python data/fabric-iq/generate_processor_tables.py --check
          python data/fabric-iq/generate_servicing_tables.py --check
          python data/generate_dashboard_snapshot.py --check
      - name: Card processor simulator (insights, guards, actions)
        working-directory: app/src/bff
        run: |
          python - <<'PY'
          from app import evergreen, pb_processor as p
          from app.processor_data import PROC
          evergreen.track(PROC); evergreen.ensure_current()
          o = p.overview()
          assert o["kpis"]["unseen_by_book"] >= 1 and o["insights"], o["kpis"]
          aid = next(i["account_id"] for i in o["insights"] if i["new_signal"])
          assert p.run_action(aid, "temp_lock")["verdict"] == "ready"
          assert "error" in p.run_action(aid, "temp_lock", execute=True)          # no approver
          r = p.run_action(aid, "temp_lock", approver="ci", execute=True)
          assert r["executed"] and r["controls"]["card_status"] == "Temporarily locked"
          assert p.run_action(aid, "temp_lock")["verdict"] == "blocked"          # already locked
          p.reset(); assert p.controls(aid)["card_status"] == "Active"
          print("processor simulator OK", o["kpis"])
          from app import pb_servicing as s
          from app.pb_data import PB
          from app.servicing_data import SVC
          evergreen.track(PB); evergreen.track(SVC); evergreen._applied = 0; evergreen.ensure_current()
          so = s.overview()
          assert so["kpis"]["payout_requests"] >= 1 and so["kpis"]["unseen_by_book"] >= 1, so["kpis"]
          cid = next(i["customer_id"] for i in so["insights"] if i["code"] == "PAYOUT_REQUESTED" and i["new_signal"])
          r = s.run_action(cid, "route_payout_to_retention", approver="ci", execute=True)
          assert r["executed"] and r["response"]["body"]["status"] == "RETENTION_REVIEW", r
          assert s.run_action(cid, "route_payout_to_retention")["verdict"] == "blocked"          # already routed
          v = next(c for c in s.REN if s.WELL[c]["wellness_band"] == "Vulnerable")
          assert s.run_action(v, "send_retention_offer")["verdict"] == "blocked"                # RP-012 support first
          s.reset(); assert s.state(cid)["payouts"][0]["status"] != "Retention review"
          print("servicing simulator OK", so["kpis"])
          PY
      - name: Brand tooling (offline)
        run: |
          python tools/brand/fetch_brand.py --manifest-only --default cfc --exclusive
          python tools/brand/fetch_brand.py --bank "Example Bank" --short Example --offline \
            --logo app/src/web/public/brand/cfc/lockup.png --primary "#0b5cab" --no-default
          python tools/brand/bank_profile.py
          BANK_ID=example python -c "import sys; sys.path.insert(0,'tools/brand'); import bank_profile as b; assert b.rebrand_text('Welcome to CFC Bank') == 'Welcome to Example', b.active_bank()"

  bicep:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file app/infra/main.bicep --stdout > /dev/null
